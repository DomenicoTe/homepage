name: Setup Monorepo
description: Setup the monorepo environment including Node and PNPM
runs: 
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: 10
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
      shell: bash