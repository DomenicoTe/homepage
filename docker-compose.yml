services:
  homepage:
    image: domeggi/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
    environment:
      HOMEPAGE_ALLOWED_HOSTS: localhost:3000
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "-Y", "off", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
